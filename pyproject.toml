[tool.poetry]
name = "xray-tools"
version = "0.1.0"
description = "Pure Python library for Xray-core configuration"
authors = ["Alexey Matveev"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/shizacat/xray-tools"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    {include = "xray_tools", from = "."},
]
include = [
    {path = "LICENSES", format = "sdist"},
]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
black = "^22.10.0"

[tool.poetry.group.test.dependencies]
pytest = "^6.2.5"
pytest-mock = "^3.6.1"

[tool.black]
target-version = ["py39"]

[tool.isort]
py_version = 39
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
