[project]
name = "xray-tools"
dynamic = ["version"]
description = "Pure Python library for Xray-core configuration"
authors = [{ name = "Alexey Matveev" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic (>=2.0,<3.0.0)",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/shizacat/xray-tools"

[tool.hatch.version]
path = "xray_tools/__init__.py"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^22.10.0"

[tool.poetry.group.test.dependencies]
pytest = "^6.2.5"
pytest-mock = "^3.6.1"

[tool.black]
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
